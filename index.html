<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@pupexa — все ссылки</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* 🎨 ЦВЕТА ФОНОВОГО ГРАДИЕНТА — плавно перетекают друг в друга */
    --bg-1: #FF3E8A; /* ярко-розовый */
    --bg-2: #FF8A3D; /* оранжевый */
    --bg-3: #7B2FF7; /* фиолетовый */
    --bg-4: #3D8AFF; /* синий */

    /* 🎨 АКЦЕНТНЫЕ ЦВЕТА КАРТОЧЕК — свой цвет под каждую соцсеть */
    --c-instagram: #FF3E8A;
    --c-tiktok:    #12C9B0;
    --c-youtube:   #FFB020;
    --c-telegram:  #4D8AFF;
    --c-vk:        #9B5DE5;

    --card-bg: #FFFFFF;  /* фон карточек-ссылок */
    --ink:     #17131F;  /* цвет обводок, теней и текста */
	--obvodka: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Manrope', sans-serif;
    background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-4));
    background-size: 300% 300%;
    animation: gradientShift 18s ease-in-out infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .link-card { transition: none; }
  }

  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 20px 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .profile {
    text-align: center;
    margin-bottom: 0px;
  }

  .avatar {
  
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 4px solid var(--obvodka);
    box-shadow: 0px 0px 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    color: var(--ink);
    margin: 0 auto 18px;
  }
  
  .avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

  .name {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1.9rem;
    color: #fff;
    text-shadow: 3px 3px 0 var(--ink);
    margin: 0 0 10px;
  }

  .bio {
    font-weight: 600;
    color: #fff;
    text-shadow: 1px 1px 0 rgba(23,19,31,0.5);
    margin: 0;
    opacity: 0.95;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
  }

  .link-card {
    --shadow-color: var(--ink);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 18px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 700;
    font-size: 1.05rem;
    box-shadow: 6px 6px 0 var(--shadow-color);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--shadow-color);
  }

  .link-card:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--shadow-color);
  }

  .link-card:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .link-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2.5px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .link-icon svg { width: 22px; height: 22px; }

  .link-icon.vk-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
  }

  .link-label { flex: 1; }

  .link-arrow {
    opacity: 0.35;
    font-size: 1.2rem;
  }

  .footer-note {
    margin-top: 40px;
    text-align: center;
    color: #fff;
    opacity: 0.75;
    font-size: 0.8rem;
    font-weight: 600;
  }
  
  .section-title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 1.1rem;
  color: #fff;
  text-shadow: 2px 2px 0 var(--ink);
  text-align: center;
  width: 100%;
  margin: 0 0 14px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: 100%;
  margin-bottom: 32px;
}

.gallery-item {
  display: block;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform 0.15s ease;
}

.gallery-item:nth-child(3n+1) { box-shadow: 4px 4px 0 var(--c-instagram); }
.gallery-item:nth-child(3n+2) { box-shadow: 4px 4px 0 var(--c-youtube); }
.gallery-item:nth-child(3n+3) { box-shadow: 4px 4px 0 var(--c-vk); }

.gallery-item:hover { transform: translate(-2px, -2px); }

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

@media (max-width: 360px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}

</style>
</head>
